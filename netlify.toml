# Netlify: build web/ (monorepo). Biến VITE_SUPABASE_URL và VITE_SUPABASE_ANON_KEY đặt trong giao diện Netlify, KHÔNG ghi ở đây.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Ứng dụng một trang (react-router): mọi đường dẫn đều trả index.html để tải lại trang /admin/... không bị 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Tệp băm tên của Vite: cache lâu dài.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
